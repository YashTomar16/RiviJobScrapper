[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rivi"
version = "0.1.0"
description = "Career-page monitoring and weekly hiring Key Insights for Riviera Partners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "apscheduler>=3.10",
  "sqlalchemy>=2.0",
  "groq>=0.9",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]
playwright = [
  "playwright>=1.40",
]

[project.scripts]
rivi = "rivi.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rivi = ["py.typed", "web/templates/*.html", "web/static/*"]
